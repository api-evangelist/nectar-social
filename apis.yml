aid: nectar-social
name: Nectar Social
description: >-
  Nectar Social is an AI "social operating system" for consumer brands — an
  AI-powered social teammate that manages online communities, performs real-time
  social listening and sentiment analysis, tracks influencers, and turns organic
  social engagement and DM conversations into measurable revenue across community,
  brand safety, commerce, influencer, social-selling, and analytics use cases.
  Founded in 2023 by Misbah and Farah Uraizee and based in Bellevue, Washington,
  the company raised $30M from Menlo Ventures, GV (Google Ventures), and True
  Ventures. Added to the API Evangelist network as a company profile; as of this
  enrichment pass Nectar Social ships a SaaS web application (app.nectarsocial.com)
  but does not publish a public API, developer portal, OpenAPI, or SDKs.
