aid: nectar-social
name: Nectar Social
description: >-
  Nectar Social is an AI "social operating system" for consumer brands — an
  AI-powered social teammate that manages online communities, performs real-time
  social listening and sentiment analysis, tracks influencers, and turns organic
  social engagement and DM conversations into measurable revenue across community,
  brand safety, commerce, influencer, social-selling, and analytics use cases.
  Founded in 2023 by Misbah and Farah Uraizee and based in Bellevue, Washington,
  the company raised $30M from Menlo Ventures, GV (Google Ventures), and True
  Ventures. Nectar Social operates a remote Model Context Protocol server at
  mcp.nectarsocial.com/mcp, protected by a full OAuth 2.1 stack — RFC 9728
  protected-resource metadata, an RFC 8414 authorization server at
  beta-api.nectarsocial.com publishing 18 fine-grained scopes, PKCE S256, dynamic
  client registration and token revocation. It is an agent-first surface: the MCP
  server is the only documented way in, and the company publishes no OpenAPI, no
  SDK and no public developer documentation, with docs.nectarsocial.com redirecting
  into a login-gated single-page application.
