apis:
- name: Nectar Social MCP Server
  description: >-
    Remote Model Context Protocol server exposing Nectar Social's social content and
    analytics to AI agents over JSON-RPC 2.0 (Streamable HTTP). OAuth-protected: an
    anonymous tools/list returns HTTP 401 with an RFC 9728 WWW-Authenticate challenge,
    so the live tool list and input schemas require an authenticated introspection.
    Requires the content:read and analytics:read scopes.
  humanURL: https://docs.nectarsocial.com/
  baseURL: https://mcp.nectarsocial.com/mcp
  tags:
  - MCP
  - Agents
  - Social Media
  - Analytics
  properties:
  - type: MCPServer
    url: mcp/nectar-social-mcp.yml
  - type: MCPServer
    url: https://mcp.nectarsocial.com/mcp
  - type: Authentication
    url: authentication/nectar-social-authentication.yml
  - type: OAuthScopes
    url: scopes/nectar-social-scopes.yml
  - type: ErrorCatalog
    url: errors/nectar-social-problem-types.yml
  - type: Conventions
    url: conventions/nectar-social-conventions.yml
- name: Nectar Social Platform API (Beta)
  description: >-
    The OAuth 2.0 authorization server and platform REST API named by the MCP server's
    protected-resource metadata. Publishes 18 scopes covering content, analytics,
    community, inbox, campaigns, competitors, social listening, workspace, custom fields,
    webhook management and contact PII (emails, phone numbers). Every path outside
    /.well-known/ and /oauth/ returns a blanket 401 until a Bearer token is presented, so
    the operation surface is not publicly enumerable and no OpenAPI is published.
  humanURL: https://docs.nectarsocial.com/
  baseURL: https://beta-api.nectarsocial.com
  tags:
  - OAuth
  - Social Media
  - Analytics
  - Webhooks
  properties:
